<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- VS Canvas icon: code cards on a canvas, joined by edges, with the one bright element of the product:
       a cyan "signal" packet travelling the main edge. Flat, VS Code dark palette. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FD4F0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#29B8DB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#29B8DB" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1B2230"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="25.25" fill="none" stroke="#2C3648" stroke-width="1.5"/>

  <!-- edges (drawn under the cards) -->
  <path d="M62 43 C 84 43 90 52 90 69" fill="none" stroke="#8A97AB" stroke-width="3" stroke-linecap="round"/>
  <path d="M84.5 64.5 L90 71.5 L95.5 64.5" fill="none" stroke="#8A97AB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 60 L38 74" fill="none" stroke="#8A97AB" stroke-width="3" stroke-linecap="round"/>

  <!-- card A: code with a highlighted line -->
  <rect x="17" y="24" width="45" height="36" rx="7" fill="#263146" stroke="#4E5E78" stroke-width="2"/>
  <rect x="24" y="32" width="22" height="4" rx="2" fill="#6F819C"/>
  <rect x="21" y="39.5" width="37" height="6" rx="2" fill="#CCA700" fill-opacity="0.28"/>
  <rect x="24" y="40.5" width="28" height="4" rx="2" fill="#E2C541"/>
  <rect x="24" y="49" width="16" height="4" rx="2" fill="#6F819C"/>

  <!-- card B -->
  <rect x="66" y="72" width="45" height="36" rx="7" fill="#263146" stroke="#4E5E78" stroke-width="2"/>
  <rect x="73" y="80" width="26" height="4" rx="2" fill="#6F819C"/>
  <rect x="73" y="88" width="18" height="4" rx="2" fill="#6F819C"/>
  <rect x="73" y="96" width="24" height="4" rx="2" fill="#6F819C"/>

  <!-- decision diamond -->
  <path d="M38 76 L51 89 L38 102 L25 89 Z" fill="#263146" stroke="#4E5E78" stroke-width="2" stroke-linejoin="round"/>

  <!-- signal packet on the main edge -->
  <circle cx="81.5" cy="46.5" r="11" fill="url(#glow)"/>
  <circle cx="81.5" cy="46.5" r="4.2" fill="#E8FAFF"/>
</svg>
